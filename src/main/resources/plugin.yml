name: NullBrand
main: si.terona.nullbrand.NullBrand$Spigot
version: ${version}
author: Terona Studios
description: Premium server-list branding engine for Velocity, BungeeCord, Waterfall and Spigot/Paper.
api-version: '1.21'
commands:
  nullbrand:
    description: NullBrand management command
    aliases: [nb]
    usage: /nb <reload|profile|maintenance|fakeplayers|status>
permissions:
  nullbrand.admin:
    description: Full access to all NullBrand commands.
    default: op
    children:
      nullbrand.reload: true
      nullbrand.profile.switch: true
      nullbrand.maintenance: true
      nullbrand.fakeplayers: true
  nullbrand.reload:
    description: Reload the NullBrand configuration.
    default: op
  nullbrand.profile.switch:
    description: Switch the active MOTD profile.
    default: op
  nullbrand.maintenance:
    description: Toggle maintenance mode.
    default: op
  nullbrand.fakeplayers:
    description: Set the fake player count.
    default: op
