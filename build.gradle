plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'si.terona'
version = '2.0.1'

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://repo.md-5.net/content/repositories/snapshots/'
    }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:4.2.0'
    annotationProcessor 'com.velocitypowered:velocity-api:4.2.0'
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.4'
    compileOnly 'io.papermc.paper:paper-api:26.3.build.194-stable'
    implementation 'org.yaml:snakeyaml:2.7'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

tasks.jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'io.papermc.paper:paper-api:26.3.build.194-stable'
    testImplementation 'com.velocitypowered:velocity-api:4.2.0'
    testImplementation 'net.md-5:bungeecord-api:1.21-R0.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
def pluginVersion = project.version.toString()
processResources {
    inputs.property 'version', pluginVersion
    filesMatching(['plugin.yml', 'bungee.yml']) { filter { line -> line.replace('${version}', pluginVersion) } }
}
jar { archiveClassifier = 'plain' }
shadowJar {
    archiveClassifier = ''
    relocate 'org.yaml.snakeyaml', 'si.terona.nullbrand.internal.yaml'
}
assemble.dependsOn shadowJar
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
// The compiler can read Java 25 platform APIs while our own classes retain Java 17 bytecode.
// Platform entry points are isolated; BungeeCord does not load the Paper/Velocity adapters.
configurations.configureEach {
    if (canBeResolved) attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked'] }
